<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pit Droid — LED Ring Preview</title>
<style>
  :root { --cy:#22e0ff; --mg:#ff2d95; --lm:#a8ff3e; --ink:#dff6ff; --dim:#6fa8c7; color-scheme:dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #04060c;
    background-image: radial-gradient(1100px 520px at 50% -15%, #0e2338 0%, #04060c 62%);
    background-attachment: fixed;
    color: var(--ink);
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px 40px;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 99;
    background: repeating-linear-gradient(0deg, rgba(180,240,255,.03) 0 1px, transparent 1px 3px);
  }
  h1 { font-size: 13px; font-weight: 600; margin: 0 0 6px; letter-spacing: .24em;
       text-transform: uppercase; color: var(--cy);
       text-shadow: 0 0 12px rgba(34,224,255,.55); }
  .sub { color: var(--dim); font-size: 11px; letter-spacing: .1em; margin-bottom: 18px;
         text-align: center; }
  .stage { position: relative; }
  canvas { display: block; width: min(88vw, 560px); height: auto;
           border-radius: 18px; border: 1px solid rgba(34,224,255,.25);
           background: radial-gradient(circle at 50% 40%, #071019 0%, #02060b 70%);
           box-shadow: inset 0 0 60px rgba(34,224,255,.06), 0 0 28px rgba(0,0,0,.6); }
  .panel {
    position: relative; width: min(92vw, 560px);
    background: linear-gradient(180deg, rgba(12,28,46,.92), rgba(4,8,14,.94));
    border: 1px solid rgba(34,224,255,.28); border-radius: 18px;
    box-shadow: inset 0 0 40px rgba(34,224,255,.06), 0 0 28px rgba(0,0,0,.55);
    padding: 16px; margin-top: 18px; display: grid; gap: 14px;
  }
  .panel::before, .panel::after {
    content: ""; position: absolute; width: 14px; height: 14px;
    border: 2px solid var(--cy); opacity: .5;
  }
  .panel::before { top: 7px; left: 7px; border-right: 0; border-bottom: 0; border-radius: 6px 0 0 0; }
  .panel::after { bottom: 7px; right: 7px; border-left: 0; border-top: 0; border-radius: 0 0 6px 0; }
  .row { display: flex; align-items: center; gap: 12px; }
  .row label { flex: 0 0 92px; font-size: 10px; letter-spacing: .18em;
               text-transform: uppercase; color: var(--dim); }
  select, input[type=range] { width: 100%; }
  select {
    background: #08121c; color: var(--ink); border: 1px solid rgba(34,224,255,.4);
    border-radius: 10px; padding: 10px 12px; font-size: 13px;
    font-family: inherit; letter-spacing: .08em; outline: none;
  }
  select:focus { border-color: var(--cy); box-shadow: 0 0 14px rgba(34,224,255,.3); }
  input[type=range] {
    -webkit-appearance: none; appearance: none; height: 26px;
    background: transparent; margin: 0;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 8px; border-radius: 99px;
    background: linear-gradient(90deg, rgba(34,224,255,.28), rgba(255,45,149,.28));
    border: 1px solid rgba(34,224,255,.38);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; margin-top: -6px;
    border-radius: 5px; border: 1px solid #eaffff;
    background: linear-gradient(180deg, #c9fbff, #22e0ff);
    box-shadow: 0 0 12px rgba(34,224,255,.85);
  }
  input[type=range]::-moz-range-track {
    height: 8px; border-radius: 99px;
    background: linear-gradient(90deg, rgba(34,224,255,.28), rgba(255,45,149,.28));
    border: 1px solid rgba(34,224,255,.38);
  }
  input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 5px; border: 1px solid #eaffff;
    background: #22e0ff; box-shadow: 0 0 12px rgba(34,224,255,.85);
  }
  input[type=color] {
    width: 100%; height: 42px; border: 1px solid rgba(34,224,255,.4);
    border-radius: 10px; background: #08121c; padding: 4px; cursor: pointer;
  }
  .value { flex: 0 0 44px; text-align: right; font-variant-numeric: tabular-nums;
           color: var(--cy); font-size: 12px; letter-spacing: .06em; }
  .btns { display: flex; gap: 10px; }
  button {
    flex: 1; padding: 12px; font-size: 10px; font-family: inherit;
    letter-spacing: .16em; text-transform: uppercase; color: var(--ink);
    cursor: pointer; border: 1px solid rgba(34,224,255,.55); border-radius: 10px;
    background: linear-gradient(180deg, rgba(34,224,255,.16), rgba(34,224,255,.04));
    box-shadow: 0 0 14px rgba(34,224,255,.14), inset 0 0 12px rgba(34,224,255,.06);
    transition: background .15s, box-shadow .15s, transform .06s;
  }
  button:hover { background: rgba(34,224,255,.26); box-shadow: 0 0 22px rgba(34,224,255,.4); }
  button:active { transform: translateY(1px); }
  button.secondary {
    border-color: rgba(111,168,199,.4); color: var(--dim);
    background: rgba(111,168,199,.08); box-shadow: none;
  }
  .legend { display: flex; justify-content: center; gap: 18px;
            color: var(--dim); font-size: 11px; letter-spacing: .12em;
            text-transform: uppercase; margin-top: 12px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
         background: var(--lm); margin-right: 6px; vertical-align: 1px;
         box-shadow: 0 0 10px rgba(168,255,62,.8); }
  .backbar { width: min(92vw, 560px); display: flex; justify-content: flex-start;
             margin-bottom: 16px; }
  .backbar a {
    color: var(--mg); text-decoration: none; font-size: 10px; font-weight: 600;
    letter-spacing: .18em; text-transform: uppercase;
    padding: 8px 14px; border: 1px solid rgba(255,45,149,.5); border-radius: 10px;
    box-shadow: 0 0 14px rgba(255,45,149,.2);
  }
  .backbar a:hover { color: #fff; border-color: var(--mg); box-shadow: 0 0 20px rgba(255,45,149,.45); }
</style>
</head>
<body>
<div class="backbar"><a href="/">&larr; Back to Control</a></div>
<h1>LED Ring Preview</h1>
<div class="sub">52 × WS2812B · 24 + 16 + 12 rings · same patterns as the firmware</div>

<div class="stage">
  <canvas id="c" width="640" height="640"></canvas>
  <div class="legend">
    <span><span class="dot"></span><span id="patName">Solid</span></span>
    <span id="frameInfo">frame 0</span>
  </div>
</div>

<div class="panel">
  <div class="row">
    <label for="mode">Pattern</label>
    <select id="mode">
      <option value="0">Solid</option>
      <option value="1" selected>Rainbow</option>
      <option value="2">Chase</option>
      <option value="3">Comet</option>
      <option value="4">Breathe</option>
      <option value="5">Sparkle</option>
      <option value="6">Scanner (Knight Rider)</option>
      <option value="7">Theater Chase</option>
      <option value="8">Ring Cycle</option>
      <option value="9">Random</option>
      <option value="10">Fire</option>
      <option value="11">Colour Wipe</option>
      <option value="12">Heartbeat Pulse</option>
      <option value="13">Rainbow Comet</option>
      <option value="14">Dual Chase</option>
    </select>
  </div>
  <div class="row">
    <label for="speed">Speed</label>
    <input type="range" id="speed" min="1" max="100" value="50">
    <span class="value" id="speedVal">50</span>
  </div>
  <div class="row">
    <label for="color">Base colour</label>
    <input type="color" id="color" value="#00ff80">
  </div>
  <div class="row">
    <label for="bri">Brightness</label>
    <input type="range" id="bri" min="10" max="255" value="200">
    <span class="value" id="briVal">200</span>
  </div>
  <div class="btns">
    <button id="play">Pause</button>
    <button class="secondary" id="step">Step</button>
  </div>
</div>

<script>
// Real hardware: 3 chained rings with unequal lengths (outer → inner).
const RING_LEDS = [24, 16, 12];
const RING_COUNT = RING_LEDS.length;
const RING_START = RING_LEDS.map((_, i) =>
  RING_LEDS.slice(0, i).reduce((a, b) => a + b, 0));
const N = RING_LEDS.reduce((a, b) => a + b, 0);
const RING_RADII = [238, 178, 118];   // ring 0 = outer (24), ring 2 = inner (12)
const LED_R = 15;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const CX = 320, CY = 320;

function ringOf(i) {
  for (let r = RING_COUNT - 1; r >= 0; r--) {
    if (i >= RING_START[r]) return r;
  }
  return 0;
}

const ui = {
  mode: document.getElementById('mode'),
  speed: document.getElementById('speed'),
  speedVal: document.getElementById('speedVal'),
  color: document.getElementById('color'),
  bri: document.getElementById('bri'),
  briVal: document.getElementById('briVal'),
  play: document.getElementById('play'),
  step: document.getElementById('step'),
  patName: document.getElementById('patName'),
  frameInfo: document.getElementById('frameInfo'),
};

const MODE_NAMES = ['Solid','Rainbow','Chase','Comet','Breathe','Sparkle','Scanner','Theater','Ring Cycle','Random','Fire','Colour Wipe','Heartbeat Pulse','Rainbow Comet','Dual Chase'];
let mode = 1, speed = 50, brightness = 200;
let base = hexToRgb(ui.color.value);
let frame = 0, playing = true, last = 0, buf = new Array(N).fill(0);

// ---- colour helpers (mirror leds.cpp) ----
function rgb(r, g, b) { return ((r & 255) << 16) | ((g & 255) << 8) | (b & 255); }
function hexToRgb(hex) {
  return [parseInt(hex.substr(1,2),16), parseInt(hex.substr(3,2),16), parseInt(hex.substr(5,2),16)];
}
function scaleColor(c, s) {
  const r = (c >> 16) & 255, g = (c >> 8) & 255, b = c & 255;
  return rgb(Math.floor(r * s / 255), Math.floor(g * s / 255), Math.floor(b * s / 255));
}
function hsv(h, s, v) {
  h &= 0xFFFF;
  const region = Math.floor(h / 10923), rem = h % 10923;
  const p = Math.floor(v * (255 - s) / 255);
  const q = Math.floor(v * (255 - Math.floor(s * rem / 10923)) / 255);
  const t = Math.floor(v * (255 - Math.floor(s * (10923 - rem) / 10923)) / 255);
  switch (region) {
    case 0: return rgb(v, t, p);
    case 1: return rgb(q, v, p);
    case 2: return rgb(p, v, t);
    case 3: return rgb(p, q, v);
    case 4: return rgb(t, p, v);
    default: return rgb(v, p, q);
  }
}

// ---- patterns (mirror leds.cpp) ----
function renderSolid() {
  const c = rgb(...base);
  for (let i = 0; i < N; i++) buf[i] = c;
}
function renderRainbow() {
  for (let i = 0; i < N; i++) {
    const hue = (Math.floor(i * 65536 / N) + frame * 256) & 0xFFFF;
    buf[i] = hsv(hue, 255, 255);
  }
}
function renderChase() {
  const dim = scaleColor(rgb(...base), 20);
  for (let i = 0; i < N; i++) buf[i] = dim;
  buf[frame % N] = rgb(...base);
}
function renderComet() {
  const tail = 8, pos = frame % N;
  for (let i = 0; i < N; i++) {
    const d = (pos - i + N) % N;
    buf[i] = d < tail ? scaleColor(rgb(...base), 255 - Math.floor(d * 255 / tail)) : 0;
  }
}
function renderBreathe() {
  const phase = frame % 120;
  let level = phase < 60 ? Math.floor(phase * 255 / 60) : Math.floor((120 - phase) * 255 / 60);
  if (level < 8) level = 8;
  const c = scaleColor(rgb(...base), level);
  for (let i = 0; i < N; i++) buf[i] = c;
}
function renderSparkle() {
  for (let i = 0; i < N; i++) buf[i] = scaleColor(buf[i], 180);
  for (let n = 0; n < 3; n++) {
    const i = Math.floor(Math.random() * N);
    buf[i] = hsv(Math.floor(Math.random() * 65536), 255, 255);
  }
}
function renderScanner() {
  const tail = 6, period = 2 * (N - 1);
  const p = frame % period;
  const pos = p < N ? p : period - p;
  for (let i = 0; i < N; i++) {
    const d = Math.abs(i - pos);
    buf[i] = d < tail ? scaleColor(rgb(...base), 255 - Math.floor(d * 255 / tail)) : 0;
  }
}
function renderTheater() {
  const full = rgb(...base), dim = scaleColor(full, 25);
  for (let i = 0; i < N; i++) buf[i] = ((i + frame) % 3 === 0) ? full : dim;
}
function renderRings() {
  for (let ring = 0; ring < RING_COUNT; ring++) {
    const hue = (Math.floor(ring * 65536 / RING_COUNT) + frame * 180) & 0xFFFF;
    const c = hsv(hue, 255, 255);
    for (let i = RING_START[ring]; i < RING_START[ring] + RING_LEDS[ring]; i++) {
      buf[i] = c;
    }
  }
}

// ---- extended patterns ----
function renderRandom() {
  for (let i = 0; i < N; i++) buf[i] = hsv(Math.floor(Math.random() * 65536), 255, 255);
}

const fireHeat = new Array(N).fill(0);
function renderFire() {
  for (let i = 0; i < N; i++) {
    const cool = Math.floor(Math.random() * 60);
    fireHeat[i] = Math.max(0, fireHeat[i] - cool);
  }
  for (let i = N - 1; i >= 2; i--) {
    fireHeat[i] = Math.floor((fireHeat[i - 1] + fireHeat[i - 2] + fireHeat[i - 2]) / 3);
  }
  if (Math.random() * 100 < 60) {
    const y = Math.floor(Math.random() * 3);
    fireHeat[y] = Math.min(255, fireHeat[y] + 160 + Math.floor(Math.random() * 96));
  }
  for (let i = 0; i < N; i++) {
    const t = fireHeat[i];
    if (t < 85) buf[i] = rgb(t * 3, 0, 0);
    else if (t < 170) buf[i] = rgb(255, (t - 85) * 3, 0);
    else buf[i] = rgb(255, 255, (t - 170) * 3);
  }
}

function renderWipe() {
  const cycle = N + 6;
  const p = frame % (cycle * 2);
  let len = p < cycle ? p : cycle * 2 - p;
  if (len > N) len = N;
  const c = rgb(...base);
  for (let i = 0; i < N; i++) buf[i] = i < len ? c : 0;
}

function renderPulse() {
  const p = frame % 48;
  let level;
  if (p < 4) level = 80 + p * 44;
  else if (p < 10) level = 255 - (p - 4) * 30;
  else if (p < 14) level = 60 + (p - 10) * 40;
  else if (p < 22) level = 220 - (p - 14) * 26;
  else level = 12;
  const c = scaleColor(rgb(...base), level);
  for (let i = 0; i < N; i++) buf[i] = c;
}

function renderRainbowComet() {
  const tail = 10, pos = frame % N;
  for (let i = 0; i < N; i++) {
    const d = (pos - i + N) % N;
    if (d < tail) {
      const hue = (frame * 512 + i * 1024) & 0xFFFF;
      const level = 255 - Math.floor(d * 255 / tail);
      buf[i] = scaleColor(hsv(hue, 255, 255), level);
    } else {
      buf[i] = 0;
    }
  }
}

function renderDualChase() {
  const dim = scaleColor(rgb(...base), 16);
  for (let i = 0; i < N; i++) buf[i] = dim;
  const a = frame % N, b = (N - 1) - a;
  const c = rgb(...base);
  buf[a] = c;
  buf[b] = c;
}

function renderFrame() {
  switch (mode) {
    case 1: renderRainbow(); break;
    case 2: renderChase(); break;
    case 3: renderComet(); break;
    case 4: renderBreathe(); break;
    case 5: renderSparkle(); break;
    case 6: renderScanner(); break;
    case 7: renderTheater(); break;
    case 8: renderRings(); break;
    case 9: renderRandom(); break;
    case 10: renderFire(); break;
    case 11: renderWipe(); break;
    case 12: renderPulse(); break;
    case 13: renderRainbowComet(); break;
    case 14: renderDualChase(); break;
    default: renderSolid(); break;
  }
  draw();
  ui.frameInfo.textContent = 'frame ' + frame;
}

// ---- draw ----
function draw() {
  ctx.clearRect(0, 0, 640, 640);

  // housing / guide rings
  for (const r of RING_RADII) {
    ctx.beginPath();
    ctx.arc(CX, CY, r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(140,160,200,0.10)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  // centre hub
  ctx.beginPath();
  ctx.arc(CX, CY, 26, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  ctx.fill();

  const bri = brightness / 255;
  for (let i = 0; i < N; i++) {
    const ring = ringOf(i);
    const idx = i - RING_START[ring];
    const angle = -Math.PI / 2 + (idx * Math.PI * 2) / RING_LEDS[ring];
    const rad = RING_RADII[ring];
    const x = CX + Math.cos(angle) * rad;
    const y = CY + Math.sin(angle) * rad;

    const c = buf[i];
    let r = (c >> 16) & 255, g = (c >> 8) & 255, b = c & 255;
    r = Math.round(r * bri); g = Math.round(g * bri); b = Math.round(b * bri);

    // off LED
    ctx.beginPath();
    ctx.arc(x, y, LED_R, 0, Math.PI * 2);
    ctx.fillStyle = '#14171f';
    ctx.fill();

    if (r + g + b > 6) {
      // glow
      ctx.save();
      ctx.shadowBlur = 26;
      ctx.shadowColor = `rgb(${r},${g},${b})`;
      ctx.beginPath();
      ctx.arc(x, y, LED_R, 0, Math.PI * 2);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.fill();
      ctx.restore();

      // hot core
      ctx.beginPath();
      ctx.arc(x - LED_R * 0.22, y - LED_R * 0.22, LED_R * 0.42, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${0.35 + 0.35 * Math.min(1, (r+g+b)/765)})`;
      ctx.fill();
    }
  }
}

// ---- timing (mirror firmware: interval = map(speed,1,100,200,10)) ----
function intervalMs() { return Math.round(200 - (speed - 1) * 190 / 99); }

function loop(ts) {
  if (playing && ts - last >= intervalMs()) {
    last = ts;
    frame++;
    renderFrame();
  }
  requestAnimationFrame(loop);
}

function syncLabels() {
  ui.speedVal.textContent = speed;
  ui.briVal.textContent = brightness;
  ui.patName.textContent = MODE_NAMES[mode] || 'Solid';
}

ui.mode.addEventListener('change', () => {
  mode = parseInt(ui.mode.value, 10);
  frame = 0;
  buf.fill(0);
  syncLabels();
  renderFrame();
});
ui.speed.addEventListener('input', () => {
  speed = parseInt(ui.speed.value, 10);
  syncLabels();
});
ui.color.addEventListener('input', () => {
  base = hexToRgb(ui.color.value);
  if (mode === 0 || mode === 2 || mode === 3 || mode === 4 || mode === 6 || mode === 7 ||
      mode === 11 || mode === 12 || mode === 14) renderFrame();
});
ui.bri.addEventListener('input', () => {
  brightness = parseInt(ui.bri.value, 10);
  syncLabels();
  draw();
});
ui.play.addEventListener('click', () => {
  playing = !playing;
  ui.play.textContent = playing ? 'Pause' : 'Play';
});
ui.step.addEventListener('click', () => {
  frame++;
  renderFrame();
});

syncLabels();
renderFrame();
requestAnimationFrame(loop);
</script>
</body>
</html>
